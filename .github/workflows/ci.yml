name: Package CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./...
        env:
          CGO_ENABLED: '0'
      - run: go build -trimpath -ldflags="-s -w" -o "$RUNNER_TEMP/lekalo-postgres" .
        env:
          CGO_ENABLED: '0'
      - run: node scripts/build.mjs --check
      - run: node --test test/provider.test.mjs
        env:
          LEKALO_POSTGRES_GO_BIN: ${{ runner.temp }}/lekalo-postgres
