name: Package CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: test
            runner: ubuntu-latest
            platform: linux-amd64
            suffix: ''
          - name: test (Windows x64)
            runner: windows-latest
            platform: windows-amd64
            suffix: .exe
          - name: test (macOS ARM64)
            runner: macos-15
            platform: darwin-arm64
            suffix: ''
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: '0'
      BINARY: lekalo-postgres-${{ matrix.platform }}-${{ github.run_attempt }}${{ matrix.suffix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache: false
      - run: go test ./...
      - name: Build the native executable
        run: |
          test "$(go env GOOS)-$(go env GOARCH)" = '${{ matrix.platform }}'
          go build -trimpath -ldflags="-s -w" -o "$BINARY" .
      - run: node scripts/build.mjs --check
      - run: node --test test/provider.test.mjs
        env:
          LEKALO_POSTGRES_GO_BIN: ${{ github.workspace }}/${{ env.BINARY }}
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ env.BINARY }}
          archive: false
          if-no-files-found: error
          retention-days: 7
